<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e1c1a" />
  <title>Мустанг — слони проти коня</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Мустанг</h1>
      <div id="stats">
        <span>Сл <strong id="st-b">—</strong></span>
        <span>Ходи <strong id="st-m">0</strong></span>
        <span>Час <strong id="st-t">0.0</strong></span>
      </div>
    </header>

    <div id="message">Оберіть рівень і натисніть «Нова гра»</div>

    <div id="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>
    </div>

    <div id="controls">
      <div class="levels">
        <button type="button" data-n="32" class="lvl">32</button>
        <button type="button" data-n="24" class="lvl">24</button>
        <button type="button" data-n="16" class="lvl active">16</button>
        <button type="button" data-n="14" class="lvl">14</button>
        <button type="button" data-n="12" class="lvl">12</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-new">Нова гра</button>
        <button type="button" id="btn-pause" class="secondary" disabled>Пауза</button>
      </div>
      <div class="actions single">
        <button type="button" id="btn-records" class="secondary">Рекорди</button>
      </div>
    </div>
  </div>

  <div id="win-panel" class="hidden overlay">
    <h2>Перемога!</h2>
    <p id="win-text"></p>
    <label class="field">
      <span>Ваше ім'я</span>
      <input id="win-name" type="text" maxlength="32" placeholder="Гравець" autocomplete="nickname" />
    </label>
    <p id="win-save-status" class="hint"></p>
    <div class="row">
      <button type="button" id="btn-save-record">Зберегти рекорд</button>
      <button type="button" id="btn-again" class="secondary">Ще раз</button>
    </div>
    <button type="button" id="btn-close" class="linkish">Закрити</button>
  </div>

  <div id="records-panel" class="hidden overlay">
    <h2>Рекорди</h2>
    <div class="tabs">
      <button type="button" class="tab active" data-src="local">На пристрої</button>
      <button type="button" class="tab" data-src="world">Світ</button>
    </div>
    <div class="sort-row">
      <button type="button" class="sort active" data-sort="time">Час</button>
      <button type="button" class="sort" data-sort="moves">Ходи</button>
      <button type="button" class="sort" data-sort="balance">Баланс</button>
    </div>
    <div class="level-row" id="rec-levels"></div>
    <div id="records-list" class="records-list"></div>
    <p id="records-hint" class="hint"></p>
    <button type="button" id="btn-records-close" class="secondary wide">Закрити</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/game_engine.js"></script>
  <script src="js/records.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
